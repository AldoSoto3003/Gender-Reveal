name: Desplegar

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_EVENT_ID: ${{ secrets.VITE_EVENT_ID }}

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Subir versión
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          RELEASE=/var/www/revelacion/releases/${GITHUB_SHA}
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" dist/ "${USER}@${HOST}:${RELEASE}/"
          ssh -i ~/.ssh/deploy_key "${USER}@${HOST}" "
            ln -sfn ${RELEASE} /var/www/revelacion/current &&
            cd /var/www/revelacion/releases &&
            ls -1t | tail -n +6 | xargs -r rm -rf
          "
