# Supabase (plan gratis) pausa el proyecto tras 7 días sin actividad.
# Esto hace una consulta pequeña a la base cada 3 días para que siga despierto.
# La llave es la pública (anon): ya viaja en la página publicada y las reglas RLS protegen los datos.
name: Mantener Supabase activo

on:
  schedule:
    - cron: '17 15 */3 * *' # cada 3 días, 9:17 am hora de CDMX
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/mantener-supabase.yml']

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: https://zfgauxphwnmqqnfbeyjh.supabase.co
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpmZ2F1eHBod25tcXFuZmJleWpoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUxMjA0MzcsImV4cCI6MjExMDY5NjQzN30.c0g8bbR0bRvLkzHb_20UdcWCgbCW_yacvxxmeYXIrAw
    steps:
      - name: Consultar la base
        run: |
          codigo=$(curl -sS -o respuesta.json -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/eventos?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Supabase respondió $codigo"
          cat respuesta.json
          test "$codigo" = "200"
