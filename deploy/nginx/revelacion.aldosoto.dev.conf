# Nginx para https://revelacion.aldosoto.dev
# Después de activarlo, corre: sudo certbot --nginx -d revelacion.aldosoto.dev
# (certbot agrega el bloque de HTTPS y la redirección desde HTTP).

server {
    listen 80;
    listen [::]:80;
    server_name revelacion.aldosoto.dev;

    root /var/www/revelacion/current;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Archivos con hash en el nombre: se guardan un año en el navegador.
    location /assets/ {
        include /etc/nginx/snippets/revelacion-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # El HTML siempre se revisa, para que una nueva versión llegue de inmediato.
    location / {
        include /etc/nginx/snippets/revelacion-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}

